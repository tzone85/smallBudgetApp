<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">smallBudgetApp data model</title>
  <desc id="desc">The store holds many named budgets. Each budget has a monthly amount, categories with optional limits, recurring templates, and expenses. Each expense belongs to a month, may point at a category, and may point back at the recurring template that spawned it.</desc>

  <defs>
    <marker id="dm-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c5a69"/>
    </marker>
  </defs>

  <rect width="920" height="420" fill="#f4f6f9"/>
  <text x="460" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1b2733">Data model</text>

  <!-- Store -->
  <rect x="40" y="80" width="240" height="96" rx="8" fill="#f4f6f9" stroke="#146c43" stroke-width="1.5"/>
  <text x="160" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">BudgetStore</text>
  <text x="160" y="128" text-anchor="middle" font-size="12" fill="#4c5a69">activeBudgetId</text>
  <text x="160" y="146" text-anchor="middle" font-size="12" fill="#4c5a69">activeMonth "YYYY-MM"</text>
  <text x="160" y="164" text-anchor="middle" font-size="12" fill="#4c5a69">budgets [ ]</text>

  <!-- Budget -->
  <rect x="360" y="80" width="240" height="96" rx="8" fill="#ffffff" stroke="#d6dce4"/>
  <text x="480" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">Budget</text>
  <text x="480" y="128" text-anchor="middle" font-size="12" fill="#4c5a69">id, name</text>
  <text x="480" y="146" text-anchor="middle" font-size="12" fill="#4c5a69">amount (per month)</text>
  <line x1="280" y1="128" x2="360" y2="128" stroke="#4c5a69" stroke-width="1.5" marker-end="url(#dm-arrow)"/>
  <text x="320" y="118" text-anchor="middle" font-size="11" fill="#4c5a69">1..n</text>

  <!-- Category -->
  <rect x="680" y="60" width="200" height="76" rx="8" fill="#ffffff" stroke="#d6dce4"/>
  <text x="780" y="86" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">Category</text>
  <text x="780" y="106" text-anchor="middle" font-size="12" fill="#4c5a69">id, name, limit?</text>
  <line x1="600" y1="104" x2="680" y2="98" stroke="#4c5a69" stroke-width="1.5" marker-end="url(#dm-arrow)"/>

  <!-- Recurring -->
  <rect x="680" y="172" width="200" height="76" rx="8" fill="#ffffff" stroke="#d6dce4"/>
  <text x="780" y="198" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">Recurring template</text>
  <text x="780" y="218" text-anchor="middle" font-size="12" fill="#4c5a69">id, title, amount, categoryId?</text>
  <line x1="600" y1="150" x2="680" y2="200" stroke="#4c5a69" stroke-width="1.5" marker-end="url(#dm-arrow)"/>

  <!-- Expense -->
  <rect x="680" y="290" width="200" height="96" rx="8" fill="#ffffff" stroke="#d6dce4"/>
  <text x="780" y="316" text-anchor="middle" font-size="14" font-weight="600" fill="#1b2733">Expense</text>
  <text x="780" y="336" text-anchor="middle" font-size="12" fill="#4c5a69">id, title, amount, month</text>
  <text x="780" y="354" text-anchor="middle" font-size="12" fill="#4c5a69">categoryId?, recurringId?</text>
  <line x1="600" y1="164" x2="682" y2="310" stroke="#4c5a69" stroke-width="1.5" marker-end="url(#dm-arrow)"/>

  <!-- Materialisation note -->
  <line x1="780" y1="248" x2="780" y2="290" stroke="#146c43" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#dm-arrow)"/>
  <text x="660" y="272" text-anchor="end" font-size="11" fill="#0f5132">copied into each month you visit, once</text>

  <text x="460" y="400" text-anchor="middle" font-size="12" fill="#4c5a69">snapshot() projects the active budget + month; serialize()/hydrate() carry the whole tree to localStorage.</text>
</svg>
